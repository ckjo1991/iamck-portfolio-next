<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="FastPH service flow thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#1f0a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="diag" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="36" height="36" fill="none"/>
      <rect x="0" y="0" width="18" height="36" fill="rgba(255,255,255,0.035)"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#diag)"/>
  <rect x="0" y="0" width="12" height="750" fill="url(#accent)"/>

  <g transform="translate(86 106)">
    <text x="0" y="0" fill="rgba(255,255,255,0.78)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18" letter-spacing="0.18em" text-transform="uppercase">
      UX case study
    </text>

    <text x="0" y="66" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="56" font-weight="700">
      FastPH service flow
    </text>

    <text x="0" y="108" fill="rgba(255,255,255,0.86)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="22">
      Matching, status clarity, and fewer drop-offs through better handoffs.
    </text>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="520" height="220" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <rect x="18" y="18" width="230" height="38" rx="12" fill="rgba(124,58,237,0.22)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="18" y="68" width="330" height="38" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="18" y="118" width="280" height="38" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="18" y="168" width="360" height="38" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <path d="M396 36 L 482 36" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
      <path d="M396 86 L 482 86" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
      <path d="M396 136 L 482 136" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
      <path d="M396 186 L 482 186" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
    </g>
