<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="KuryentePH dashboard thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect x="0" y="0" width="12" height="750" fill="url(#accent)"/>

  <g transform="translate(86 106)">
    <text x="0" y="0" fill="rgba(255,255,255,0.78)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18" letter-spacing="0.18em" text-transform="uppercase">
      UX case study
    </text>

    <text x="0" y="66" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="56" font-weight="700">
      KuryentePH dashboard
    </text>

    <text x="0" y="108" fill="rgba(255,255,255,0.86)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="22">
      Clear breakdowns, comparisons, and everyday context for energy use.
    </text>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="520" height="220" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <rect x="18" y="18" width="220" height="14" rx="7" fill="rgba(255,255,255,0.16)"/>
      <rect x="18" y="48" width="170" height="12" rx="6" fill="rgba(255,255,255,0.12)"/>
      <rect x="18" y="80" width="484" height="110" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <path d="M48 168 C 120 120, 190 182, 260 140 S 404 160, 472 120" fill="none" stroke="rgba(245,158,11,0.85)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="48" cy="168" r="5" fill="rgba(245,158,11,0.95)"/>
      <circle cx="260" cy="140" r="5" fill="rgba(245,158,11,0.95)"/>
      <circle cx="472" cy="120" r="5" fill="rgba(245,158,11,0.95)"/>
    </g>
